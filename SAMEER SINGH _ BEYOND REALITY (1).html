<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{margin:0;background:#000;color:var(--tx);font-family:Rajdhani,system-ui,sans-serif;font-size:17px;overflow-x:hidden}

.title{text-align:center;margin-top:auto;padding-bottom:6px}

.card{position:relative;width:min(760px,100%);max-height:88svh;overflow:auto;padding:26px 22px;border-radius:24px;background:linear-gradient(160deg,rgba(20,20,50,.75),rgba(5,5,20,.85));border:1px solid rgba(255,255,255,.18);box-shadow:0 0 60px var(--a),inset 0 0 40px rgba(155,77,255,.15);transform:translateY(40px) scale(.94);transition:.5s cubic-bezier(.2,.9,.2,1)}

#flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(circle,var(--a),transparent 60%);transition:opacity .6s}
@media(max-width:520px){.btn{padding:10px 11px;font-size:10px}.brand{flex-direction:column;align-items:center}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var P=[["#1e6bff","#9b4dff"],["#ff2d95","#ff9a3c"],["#00ffc8","#1e90ff"],["#ff3b3b","#ffd23c"]];
var pi=0,S={speed:1,target:1,pulse:0,shock:1,grav:0,mx:0,my:0},T3=null,fb=null;
var cv=$("#gl");

function setTheme(i){
  pi=((i%P.length)+P.length)%P.length;
  var r=document.documentElement.style;r.setProperty("--a",P[pi][0]);r.setProperty("--b",P[pi][1]);
  if(T3)T3.apply();
  var f=$("#flash");f.style.opacity=.35;setTimeout(function(){f.style.opacity=0},250);
}

/* ---------- THREE.JS SCENE ---------- */
function init3D(){
  if(!window.THREE)throw new Error("no three");
  var R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setClearColor(0x000000,1);
  var sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1,.1,400);
  var U={time:{value:0},c1:{value:new THREE.Color()},c2:{value:new THREE.Color()}};
  var world=new THREE.Group();sc.add(world);

  // stars
  var N=4500,sp=new Float32Array(N*3);
  for(var i=0;i<N;i++){var r=30+Math.random()*130,t=Math.random()*6.283,p=Math.acos(2*Math.random()-1);
    sp[i*3]=r*Math.sin(p)*Math.cos(t);sp[i*3+1]=r*Math.sin(p)*Math.sin(t);sp[i*3+2]=r*Math.cos(p);}
  var sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.BufferAttribute(sp,3));
  var stars=new THREE.Points(sg,new THREE.PointsMaterial({size:.28,color:0xffffff,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending}));
  sc.add(stars);

  // orb
  var orbMat=new THREE.ShaderMaterial({uniforms:U,
    vertexShader:"uniform float time;varying vec3 vN;varying vec3 vP;void main(){vec3 p=position;float d=sin(p.x*3.+time)*sin(p.y*3.+time*1.3)*sin(p.z*3.+time*.7)*.09;p+=normal*d;vP=p;vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}",
    fragmentShader:"uniform float time;uniform vec3 c1;uniform vec3 c2;varying vec3 vN;varying vec3 vP;void main(){float f=pow(1.-abs(dot(normalize(vN),vec3(0.,0.,1.))),2.);float m=clamp(vP.y*.5+.5+sin(time*.8+vP.x*4.)*.25+sin(vP.z*5.-time)*.15,0.,1.);vec3 c=mix(c1,c2,m);gl_FragColor=vec4(c*(.3+f*1.9)+vec3(.9)*pow(f,6.)*.4,1.);}"});
  var orb=new THREE.Mesh(new THREE.SphereGeometry(1,96,96),orbMat);world.add(orb);
  var haloMat=new THREE.ShaderMaterial({uniforms:U,transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false,
    vertexShader:"varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
    fragmentShader:"uniform vec3 c1;uniform vec3 c2;varying vec3 vN;void main(){float i=pow(max(.72-dot(vN,vec3(0.,0.,1.)),0.),3.);gl_FragColor=vec4(mix(c1,c2,.5)*i*2.4,i);}"});
  var halo=new THREE.Mesh(new THREE.SphereGeometry(1.45,64,64),haloMat);world.add(halo);

  // rings
  var rings=[],rm=[];
  [[1.65,.012,[1.2,0,0]],[1.95,.009,[.4,.9,0]],[2.3,.007,[-.7,.2,.6]]].forEach(function(d,k){
    var m=new THREE.MeshBasicMaterial({transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false});
    var r=new THREE.Mesh(new THREE.TorusGeometry(d[0],d[1],12,220),m);r.rotation.set(d[2][0],d[2][1],d[2][2]);world.add(r);rings.push(r);rm.push(m);});
  var shock=new THREE.Mesh(new THREE.TorusGeometry(1.2,.02,8,120),new THREE.MeshBasicMaterial({transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  world.add(shock);

  // galaxy waves
  var GN=9000,aR=new Float32Array(GN),aA=new Float32Array(GN),aS=new Float32Array(GN),z=new Float32Array(GN*3);
  for(i=0;i<GN;i++){var rr=Math.pow(Math.random(),.7)*7+1.2;aR[i]=rr;aA[i]=Math.random()*6.283+rr*.9*((i%3)-1)*.0+ (i%3)*2.094+rr*.6;aS[i]=Math.random();}
  var gg=new THREE.BufferGeometry();gg.setAttribute("position",new THREE.BufferAttribute(z,3));
  gg.setAttribute("aR",new THREE.BufferAttribute(aR,1));gg.setAttribute("aA",new THREE.BufferAttribute(aA,1));gg.setAttribute("aS",new THREE.BufferAttribute(aS,1));
  var gal=new THREE.Points(gg,new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:"uniform float time;attribute float aR;attribute float aA;attribute float aS;varying float vR;varying float vS;void main(){float a=aA+time*.35/(aR*.35+.6);float y=sin(aR*2.2-time*1.2+aA)*.28*(1.+aS);vec3 p=vec3(cos(a)*aR,y,sin(a)*aR);vR=aR;vS=aS;vec4 mv=modelViewMatrix*vec4(p,1.);gl_PointSize=(1.2+aS*2.6)*(260./-mv.z);gl_Position=projectionMatrix*mv;}",
    fragmentShader:"uniform vec3 c1;uniform vec3 c2;varying float vR;varying float vS;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float a=smoothstep(.5,0.,d);gl_FragColor=vec4(mix(c1,c2,clamp((vR-1.)/7.,0.,1.))*(.7+vS)+vec3(.25)*vS,a*.85);}"}));
  gal.frustumCulled=false;gal.rotation.x=.35;gal.rotation.z=-.18;world.add(gal);

  // ribbons
  var rib=[],RN=180;
  for(i=0;i<5;i++){var g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(new Float32Array(RN*3),3));
    var l=new THREE.Line(g,new THREE.LineBasicMaterial({transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));l.frustumCulled=false;world.add(l);rib.push(l);}

  function apply(){
    U.c1.value.set(P[pi][0]);U.c2.value.set(P[pi][1]);
    rm.forEach(function(m,k){m.color.set(P[pi][k%2])});
    shock.material.color.set(P[pi][1]);
    rib.forEach(function(l,k){l.material.color.set(P[pi][k%2])});
  }
  apply();

  function resize(){
    var w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;
    var mob=w/h<.8;cam.position.set(0,0,mob?11.5:9.2);world.position.y=mob?1.5:.4;
    cam.updateProjectionMatrix();
  }
  resize();addEventListener("resize",resize);

  var clock=new THREE.Clock();
  function loop(){
    requestAnimationFrame(loop);
    var dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
    S.speed+=(S.target-S.speed)*.05;S.pulse*=.93;
    U.time.value+=dt*(S.grav?2.6:1)*(1+(S.speed-1)*.5);
    var tm=U.time.value;
    stars.rotation.y+=dt*.01*S.speed;stars.rotation.z+=dt*.004*S.speed;
    var fv=55+(S.speed-1)*9;if(Math.abs(cam.fov-fv)>.05){cam.fov=fv;cam.updateProjectionMatrix();}
    orb.rotation.y+=dt*.2;
    var sc1=1+S.pulse*.28+Math.sin(t*1.5)*.02;orb.scale.setScalar(sc1);halo.scale.setScalar(sc1);
    rings.forEach(function(r,k){r.rotation.z+=dt*(.25+k*.18)*(k%2?-1:1)*S.speed;r.rotation.x+=dt*.07*(k+1)});
    gal.rotation.y+=dt*.03;
    rib.forEach(function(l,k){var a=l.geometry.attributes.position.array,A=1.8+k*.38;
      for(var j=0;j<RN;j++){var u=j/(RN-1)*6.283;
        a[j*3]=Math.cos(u*(2+k%2)+tm*.5+k)*A;a[j*3+1]=Math.sin(u*(3+k)+tm*(.6+k*.1))*A*.35;a[j*3+2]=Math.sin(u*(2+(k+1)%2)-tm*.4)*A;}
      l.geometry.attributes.position.needsUpdate=true;});
    if(S.shock<1){S.shock+=dt*.7;var s=1+S.shock*7;shock.scale.set(s,s,s);shock.material.opacity=Math.max(0,1-S.shock);shock.rotation.x=1.4;}else shock.material.opacity=0;
    world.rotation.y+=(S.mx*.35-world.rotation.y)*.03;world.rotation.x+=(S.my*.2-world.rotation.x)*.03;
    R.render(sc,cam);
  }
  loop();
  cv.addEventListener("webglcontextlost",function(e){e.preventDefault();startFallback();});
  return {apply:apply};
}

/* ---------- 2D FALLBACK ---------- */
function startFallback(){
  if(fb)return;
  var c=cv.getContext("2d");if(!c)return;
  var W,H,st=[],pt=[];
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener("resize",rs);
  for(var i=0;i<500;i++)st.push({x:Math.random(),y:Math.random(),z:Math.random()*2+.2});
  for(i=0;i<500;i++)pt.push({a:Math.random()*6.283,r:Math.random()*.45+.12,s:(Math.random()*.4+.1)});
  var t=0;fb=true;
  (function f(){
    requestAnimationFrame(f);t+=.016*S.speed;S.speed+=(S.target-S.speed)*.05;S.pulse*=.93;
    c.fillStyle="#000";c.fillRect(0,0,W,H);
    st.forEach(function(s){s.x-=.0004*s.z*S.speed;if(s.x<0)s.x=1;c.fillStyle="rgba(255,255,255,"+(.3+s.z*.3)+")";c.fillRect(s.x*W,s.y*H,s.z,s.z);});
    var cx=W/2,cy=H*(W/H<.8?.38:.44),R=Math.min(W,H)*.2*(1+S.pulse*.25);
    var A=P[pi][0],B=P[pi][1];
    c.globalCompositeOperation="lighter";
    var g=c.createRadialGradient(cx,cy,R*.2,cx,cy,R*2.2);g.addColorStop(0,B+"cc");g.addColorStop(.4,A+"55");g.addColorStop(1,"#0000");
    c.fillStyle=g;c.beginPath();c.arc(cx,cy,R*2.2,0,6.283);c.fill();
    var o=c.createRadialGradient(cx-R*.3,cy-R*.3,R*.1,cx,cy,R);o.addColorStop(0,"#fff");o.addColorStop(.3,A);o.addColorStop(1,B);
    c.fillStyle=o;c.beginPath();c.arc(cx,cy,R,0,6.283);c.fill();

    c.globalCompositeOperation="source-over";
  })();
}

  pr1("BEYOND REALITY OS v9.4 — created by Sameer Singh");pr1("type 'help' for commands");
  $("#ti").addEventListener("keydown",function(e){
    if(e.key==="Enter")runCmd();
    if(e.key==="ArrowUp"&&hist.length){hi=Math.max(0,hi-1);this.value=hist[hi];e.preventDefault();}
    if(e.key==="ArrowDown"){hi=Math.min(hist.length,hi+1);this.value=hist[hi]||"";}
  });
}
function runCmd(){
  var i=$("#ti");if(!i)return;var raw=i.value.trim();i.value="";if(!raw)return;
  hist.push(raw);hi=hist.length;pr1("sameer@orb:~$ "+raw);
  var p=raw.toLowerCase().split(/\s+/),c=p[0];
  var map={
   help:function(){pr1("help about status scan theme warp pulse gravity galaxy time whoami open <section> clear");},
   about:function(){pr1("Sameer Singh — builder of worlds. Powered by imagination.");},
   whoami:function(){pr1("visitor@beyond-reality  (clearance: COSMIC)");},
   status:function(){pr1("CORE: ONLINE | ENERGY: "+(80+Math.floor(Math.random()*20))+"% | RENDER: "+(T3?"WEBGL":"2D FALLBACK"));},
   scan:function(){pr1("scanning...");setTimeout(function(){pr1("found 4,500 stars, 9,000 particles, 5 ribbons, 1 sentient orb");},700);},
   theme:function(){setTheme(pi+1);pr1("palette "+(pi+1)+"/"+P.length+" applied");},
   warp:function(){warp();pr1("hyperspace engaged...");},
   pulse:function(){shock();pr1("shockwave released");},
   gravity:function(){S.grav=S.grav?0:1;pr1("gravity "+(S.grav?"amplified":"normal"));},
   galaxy:function(){setTheme(pi+1);warp();pr1("galaxy reconfigured");},
   time:function(){pr1(new Date().toString());},
   clear:function(){$("#term").innerHTML="";},
   open:function(){var m={cosmos:"cosmos",ai:"ai",digital:"digital",experiments:"lab",lab:"lab",about:"about"};
     if(m[p[1]]){pr1("opening "+p[1]+"...");setTimeout(function(){openP(m[p[1]])},500);}else pr1("usage: open cosmos|ai|digital|experiments|about");}
  };
  if(map[c])map[c]();else pr1("command not found: "+c.slice(0,30)+" (try help)");
}
})();
